version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-payflow}
      POSTGRES_USER: ${DB_USERNAME:-payflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-payflow} -d ${DB_NAME:-payflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payflow-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-payflow}
      DB_USERNAME: ${DB_USERNAME:-payflow}
      DB_PASSWORD: ${DB_PASSWORD:-payflow_secret}
      JWT_SECRET: ${JWT_SECRET:-payflow-jwt-secret-key-must-be-at-least-32-chars-long-for-hs256}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - payflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payflow-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - payflow-net

networks:
  payflow-net:
    driver: bridge

volumes:
  postgres_data:

