spring:
  application:
    name: payflow-gateway
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

payflow:
  jwt:
    secret: ${JWT_SECRET:payflow-jwt-secret-key-must-be-at-least-32-chars-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gateway:
    fee-rate-bps: 200
    supported-currencies: INR,USD,EUR,GBP

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.payflow: INFO
    org.springframework.security: WARN

